spring.application.name=triplea
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI Agent
agent.base-url=${AGENT_URL}

# Facebook
facebook.api-url=${FACEBOOK_API_URL:}
facebook.page-id=${FACEBOOK_PAGE_ID:}
facebook.token=${FACEBOOK_TOKEN:}

# Discord
discord.webhook-url=${DISCORD_API_URL:}

# 자동 재시도·복구 (Track A)
ad.recovery.enabled=true
ad.recovery.interval=1m
ad.recovery.stale-after=5m
ad.recovery.max-auto-retries=3
# 게시 여부 확인이 들어가기 전까지 발행은 자동 재시도하지 않음
ad.recovery.publish-retry-enabled=false
ad.recovery.publish-check-delay=5m
ad.recovery.batch-size=20
