spring.application.name=triplea
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI Agent
agent.base-url=${AGENT_URL}

# Facebook
facebook.api-url=${FACEBOOK_API_URL:}
facebook.page-id=${FACEBOOK_PAGE_ID:}
facebook.token=${FACEBOOK_TOKEN:}

# Discord
discord.webhook-url=${DISCORD_API_URL:}

# 자동 재시도·복구 (Track A)
ad.recovery.enabled=true
ad.recovery.interval=1m
ad.recovery.stale-after=5m
ad.recovery.max-auto-retries=3
# 발행 실패 시 페이지에 게시된 글을 조회해 게시 여부를 확인한 뒤 자동 재시도. false면 발행 실패 1회로 FAILED (재발행 없음)
ad.recovery.publish-retry-enabled=true
ad.recovery.publish-check-delay=5m
# 한 주기에 실행하는 복구 건수 상한
ad.recovery.batch-size=20

# 생성 광고 이미지 (agent와 함께 마운트하는 공유 볼륨, Track C)
ad.image.dir=${AD_IMAGE_DIR:/data/ad-images}
